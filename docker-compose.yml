services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wishubest
      POSTGRES_PASSWORD: wishubest
      POSTGRES_DB: wishubest
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishubest"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wishubest
      MINIO_ROOT_PASSWORD: wishubest-dev-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
